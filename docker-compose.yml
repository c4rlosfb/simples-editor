services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - simples-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - VITE_SUPABASE_URL=${SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - VITE_API_BASE=/api
      - VITE_WS_BASE=/ws
    restart: unless-stopped
    networks:
      - simples-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - EXEC_TIMEOUT_S=${EXEC_TIMEOUT_S:-10}
      - COMPILE_TIMEOUT_S=${COMPILE_TIMEOUT_S:-15}
      - MAX_CODE_KB=${MAX_CODE_KB:-64}
      - RUNS_PER_MINUTE=${RUNS_PER_MINUTE:-30}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-simples-runner:latest}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - simples_tmp:/tmp/simples
    depends_on:
      runner_image_build:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - simples-net

  runner_image_build:
    image: simples-runner:latest
    build:
      context: ./runner
      dockerfile: Dockerfile
    command: ["true"]
    restart: "no"
    networks:
      - simples-net

volumes:
  simples_tmp:

networks:
  simples-net:
    driver: bridge
