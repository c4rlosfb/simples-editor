name: CI — Testes e Lint

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests/ backend/tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npm run typecheck 2>/dev/null || true
