# docker-compose.demo.yml — versão funcional para apresentação
services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - simples-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - VITE_DEMO_MODE=true
    networks:
      - simples-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    expose:
      - "5000"
    environment:
      - SUPABASE_URL=https://hdrkvdlalhdzesgbwbta.supabase.co
      - SUPABASE_ANON_KEY=eyJhbG...I2y0
      - SUPABASE_JWT_SECRET=wSe3ySdizWnHox6yvkVgqQ3GWpfdvVnjAA4DqdB1TgCiixOR67q+SsRxWyx+XiFjYnBPgafgZ3l6A+2/S9XqXQ==
      - FLASK_ENV=development
      - LOG_LEVEL=INFO
      - SANDBOX_IMAGE=simples-runner:latest
      - EXEC_TIMEOUT_S=10
      - COMPILE_TIMEOUT_S=15
      - MAX_CODE_KB=64
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - simples_tmp:/tmp/simples
    depends_on:
      runner_image_build:
        condition: service_completed_successfully
    networks:
      - simples-net

  runner_image_build:
    image: simples-runner:latest
    build:
      context: ./runner
      dockerfile: Dockerfile
    command: ["true"]
    restart: "no"
    networks:
      - simples-net

volumes:
  simples_tmp:

networks:
  simples-net:
    driver: bridge
