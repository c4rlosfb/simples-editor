# docker-compose.demo.yml — versão funcional para apresentação
# Backend usa Python slim (sem apt-get no Windows)
# Frontend build com npm install (não npm ci)
# Runner usa imagem já buildada
services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - simples-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - VITE_DEMO_MODE=true
    networks:
      - simples-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    expose:
      - "5000"
    environment:
      - FLASK_ENV=development
      - LOG_LEVEL=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - simples-net

networks:
  simples-net:
    driver: bridge
